name: Apply Player 12 site fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update navigation and Player 12 location background
        run: |
          python3 - <<'PY'
          from pathlib import Path

          link = '<a href="player-12.html">השחקן ה־12</a>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Desktop navigation: add Player 12 once to the main nav.
              nav_start = text.find('<nav class="links">')
              if nav_start != -1:
                  nav_end = text.find('</nav>', nav_start)
                  if nav_end != -1:
                      nav_block = text[nav_start:nav_end]
                      if 'href="player-12.html"' not in nav_block:
                          text = text[:nav_end] + link + text[nav_end:]

              # Mobile navigation: add Player 12 once near the top of the mobile menu.
              mobile_marker = '<div class="mobile-menu" id="mobileMenu">'
              mobile_start = text.find(mobile_marker)
              if mobile_start != -1:
                  insert_at = mobile_start + len(mobile_marker)
                  mobile_sample = text[insert_at:insert_at + 3000]
                  if 'href="player-12.html"' not in mobile_sample:
                      text = text[:insert_at] + link + text[insert_at:]

              # Player 12 page: keep the map/location area consistent with the dark podcast design.
              if path.name == 'player-12.html':
                  text = text.replace(
                      '.podcast-page .location-section{background:#e8f3f7;color:#17384a}',
                      '.podcast-page .location-section{background:#0b151f;color:#17384a}'
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed))
          PY
      - name: Commit site changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-player12-site-fix.yml
          git add '*.html'
          git commit -m "Add Player 12 navigation site-wide and darken podcast location"
          git push