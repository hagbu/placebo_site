name: Move Player 12 mobile link last

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Player 12 to the bottom of every mobile menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          player_link = '<a href="player-12.html">השחקן ה־12</a>'
          changed=[]

          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              original=text
              marker='<div class="mobile-menu" id="mobileMenu">'
              start=text.find(marker)
              if start == -1:
                  continue

              content_start=start+len(marker)
              # Mobile menus are followed by main/section/header content. Find the first safe boundary.
              candidates=[i for tag in ('<main','<section','<div class="hero','<div class="room-hero') if (i:=text.find(tag,content_start))!=-1]
              if not candidates:
                  continue
              end=min(candidates)
              block=text[content_start:end]

              # Remove any existing Player 12 top-level mobile links from this menu.
              block=re.sub(r'<a\s+href=["\']player-12\.html["\'][^>]*>\s*השחקן\s+ה[־-]12\s*</a>', '', block)

              # The mobile-menu wrapper closes at the final </div> before the next page section.
              close=block.rfind('</div>')
              if close == -1:
                  continue
              block=block[:close] + player_link + block[close:]
              text=text[:content_start]+block+text[end:]

              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(path.name)

          print('Updated mobile menus:', ', '.join(changed))
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-player12-mobile-last.yml
          git add '*.html'
          git commit -m "Move Player 12 to bottom of all mobile menus"
          git push